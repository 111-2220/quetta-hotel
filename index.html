<div class="g2"><div class="pn"><h3>Expenses (this period)</h3><div class="row"><input id="en" placeholder="e.g. Chicken, gas"><input id="ea" type="number" placeholder="Amount"><button class="pri" onclick="addE()">Add</button></div><div class="chips">${['Chicken','Gas','Vegetables','Oil','Flour','Salary','Electricity','Rent'].map(c=>`<button onclick="$('#en').value='${c}';$('#ea').focus()">${c}</button>`).join('')}</div>${E.sort((a,b)=>b.at-a.at).map(e=>`<div class="tt"><span>${esc(e.n)} <small>${new Date(e.at).toLocaleDateString()}</small></span><span>${R(e.a)} <button onclick="delE(${e.id})">✕</button></span></div>`).join('')}</div>
<div class="pn"><h3>Cash drawer check (today)</h3>${S.orders.length?`<p class="dg">⚠ ${S.orders.length} order(s) are still open. Pay or cancel them before counting cash.</p>`:''}<label>Opening cash in drawer<input type="number" value="${S.float||''}" oninput="S.float=+this.value||0;save();clc()" style="width:100%"></label><p>Expected now: <b id="exl">${R(expc)}</b> <small>(opening cash + cash sales + khata cash received − expenses)</small></p><label>Counted cash<input id="cc" type="number" oninput="clc()" style="width:100%"></label><p id="cx"><b></b></p><div class="row"><button class="pri" onclick="saveClose()">Save day-end count</button><button onclick="zr()">🖨 Print today’s summary</button></div>${S.closes.slice(0,5).map(c=>`<div class="tt"><small>${new Date(c.at).toLocaleString()}</small><span class="${c.diff?'dg':'ok'}">${c.diff?(c.diff>0?'+':'−')+R(Math.abs(c.diff)):'✔ matched'}</span></div>`).join('')}</div></div>
<div class="pn"><h3>Bills (latest 40)</h3><div class="sc">${[...all].sort((a,b)=>b.at-a.at).slice(0,40).map(x=>`<div class="hr ${x.v?'vd':''}"><span>#${x.id} · ${new Date(x.at).toLocaleString([],{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</span><span>${x.type}${x.table?' '+x.table:''}</span><b>${R(x.g)}</b><span>${x.m}</span><button onclick="rp(${x.id})">Print</button>${x.v?'<small>Refunded</small>':`<button onclick="rf(${x.id})">Refund</button>`}</div>`).join('')||'<p class="mu">No bills in this period</p>'}</div></div>
<div class="pn"><h3>Security log (cancelled orders, removed items, discounts, refunds)</h3>${S.voids.slice(-12).reverse().map(v=>`<div class="tt"><span>${esc(v.n)}</span><small>${new Date(v.at).toLocaleString()}</small></div>`).join('')||'<p class="mu">Nothing logged</p>'}</div>`}
function zr(){const[a,b]=range('today'),L=S.sales.filter(x=>!x.v&&x.at>=a&&x.at<b),k=tc(),g=m=>sum(L.filter(x=>x.m==m),x=>x.g);WT=S.name+' - Daily summary '+new Date().toLocaleDateString()+'\nBills: '+L.length+'\n'+METH.map(m=>m+': '+R(g(m))).join('\n')+'\nTotal sales: '+R(sum(L,x=>x.g))+'\nExpenses: '+R(k.e)+'\nCash in drawer: '+R(S.float+k.c-k.e);WP='';modal(`<div class="rc"><h3 style="text-align:center;margin:0">${esc(S.name)}</h3><p style="justify-content:center">Daily summary · ${new Date().toLocaleDateString()}</p><hr><p><span>Bills</span><span>${L.length}</span></p>${METH.map(m=>`<p><span>${m}</span><span>${R(g(m))}</span></p>`).join('')}<hr><p><b>Total sales</b><b>${R(sum(L,x=>x.g))}</b></p><p><span>Discounts</span><span>${R(sum(L,x=>x.d))}</span></p><p><span>Expenses</span><span>${R(k.e)}</span></p><p><span>Opening cash</span><span>${R(S.float)}</span></p><p><b>Cash in drawer</b><b>${R(S.float+k.c-k.e)}</b></p><p><span>Open orders</span><span>${S.orders.length}</span></p></div>${ACT}`)}
function clc(){const k=tc(),e=S.float+k.c-k.e,v=$('#cc').value,d=(+v)-e;$('#exl').textContent=R(e);$('#cx').textContent=v===''?'':d==0?'✔ Matches':(d>0?'Over by ':'Short by ')+R(Math.abs(d))}
function saveClose(){const v=$('#cc').value;if(v==='')return toast('Enter the counted cash');const k=tc(),e=S.float+k.c-k.e;S.closes.unshift({at:Date.now(),exp:e,got:+v,diff:+v-e});S.closes=S.closes.slice(0,60);save();income();toast('Day-end count saved')}
function addE(){const n=$('#en').value.trim(),a=+$('#ea').value;if(!n||!a)return toast('Enter name and amount');S.exp.push({id:++S.eid,n,a,at:Date.now()});save();income()}
function delE(id){pinM(()=>{S.exp=S.exp.filter(e=>e.id!=id);S.voids.push({at:Date.now(),n:'Expense deleted'});save();income()},'Deleting an expense needs the PIN.')}
const rp=id=>receipt(S.sales.find(x=>x.id==id));
function rf(id){const x=S.sales.find(s=>s.id==id);pinM(()=>{x.v=1;S.voids.push({at:Date.now(),n:'Refunded bill #'+id+' ('+R(x.g)+')'});save();income()},'Refund bill #'+id+' ('+R(x.g)+')? It will be removed from income.')}
function wipe(){pinM(()=>{S.orders=[];S.sales=[];S.exp=[];S.closes=[];S.voids=[];S.recv=[];S.seq=1;S.eid=0;S.demo=0;S.float=0;U.cur=null;save();main();toast('All sales data deleted')},'This deletes ALL orders, sales, expenses and logs. It cannot be undone.')}
const lst=(v,fb)=>{const a=v.split(',').map(s=>s.trim()).filter(Boolean);return a.length?a:fb};
function menuV(){const vis=S.menu.filter(m=>!m.h);$('#main').innerHTML=(S.demo?`<div class="dm"><b>Demo data is loaded.</b> <button onclick="wipe()">Delete all demo data</button></div>`:'')+
`<div class="pn"><h3>Settings</h3><div class="row"><label>Restaurant name<input style="width:100%" value="${esc(S.name)}" onchange="S.name=this.value.trim()||'Quetta Hotel';save();hdr()"></label><label>Tax / GST %<input style="width:100%" type="number" min="0" value="${S.tax}" onchange="S.tax=Math.max(0,+this.value||0);save()"></label><label>Number of tables<input style="width:100%" type="number" min="1" max="60" value="${S.tables}" onchange="S.tables=Math.max(1,Math.min(60,Math.max(+this.value||12,...S.orders.map(o=>o.table||0))));this.value=S.tables;save()"></label><label>Round bill to<select style="width:100%" onchange="S.round=+this.value;save()">${[[0,'Exact'],[5,'Rs 5'],[10,'Rs 10']].map(([v,t])=>`<option value="${v}" ${S.round==v?'selected':''}>${t}</option>`).join('')}</select></label><label>Daily target (Rs)<input style="width:100%" type="number" min="0" value="${S.target}" onchange="S.target=Math.max(0,+this.value||0);save();hdr()"></label></div>
<div class="row"><label>Waiters (comma separated)<input style="width:100%" value="${esc(S.waiters.join(', '))}" onchange="S.waiters=lst(this.value,S.waiters);save()"></label><label>Riders (comma separated)<input style="width:100%" value="${esc(S.riders.join(', '))}" onchange="S.riders=lst(this.value,S.riders);save()"></label></div>
<div class="row"><input id="np2" type="password" placeholder="New manager PIN (4+ digits)"><button onclick="chPin()">Change PIN</button></div></div>
<div class="pn"><h3>Backup</h3><p class="mu">Data is saved automatically in this browser on this computer. Download a backup regularly and keep it safe.</p><div class="row"><button class="pri" onclick="backup()">⬇ Download backup</button><input type="file" accept=".json" onchange="restore(this.files[0])"></div><button class="dg" onclick="wipe()">Delete all sales data…</button></div>
<div class="pn"><h3>Add item</h3><div class="row"><input id="nc" placeholder="Category" list="cl"><input id="nn" placeholder="Item name"><input id="nu" placeholder="اردو نام"><input id="np" type="number" placeholder="Price"><button class="pri" onclick="addI()">Add</button></div><datalist id="cl">${[...new Set(vis.map(m=>m.c))].map(c=>`<option>${esc(c)}</option>`).join('')}</datalist></div>
<div class="pn"><h3>Items <small>(new prices apply to new orders; open orders keep their old price)</small> <button onclick="S.menu.forEach(m=>m.s=0);save();menuV()">Mark all available</button></h3>${vis.map(m=>`<div class="mr"><span>${esc(m.n)}</span><small>${esc(m.c)}</small><input type="number" min="0" value="${m.p}" onchange="mi(${m.id}).p=Math.max(0,+this.value||0);save()"><button class="tgl ${m.s?'off':''}" onclick="mi(${m.id}).s^=1;save();menuV()">${m.s?'Sold out':'Available'}</button><button title="Remove from menu" onclick="mi(${m.id}).h=1;save();menuV()">✕</button></div>`).join('')}</div>`}
function chPin(){const v=$('#np2').value.trim();if(v.length<4)return toast('PIN needs at least 4 digits');pinM(()=>{S.pin=v;save();menuV();toast('PIN changed')},'Enter the current PIN to change it.')}
function addI(){const c=$('#nc').value.trim(),n=$('#nn').value.trim(),p=+$('#np').value;if(!c||!n||!p)return toast('Fill category, name and price');S.menu.push({id:Math.max(...S.menu.map(m=>m.id))+1,c,n,u:$('#nu').value.trim(),p,s:0});save();menuV()}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='quetta-hotel-backup-'+dk(Date.now())+'.json';a.click()}
function restore(f){if(!f)return;const r=new FileReader();r.onload=()=>{let s;try{s=JSON.parse(r.result)}catch(e){}if(!s||!s.menu||!s.orders)return toast('That is not a valid backup file');pinM(()=>{S=s;fillDef();save();main();toast('Backup restored')},'Restoring replaces ALL current data.')};r.readAsText(f)}
init();
</script></body></html>
